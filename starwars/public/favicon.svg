<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="65%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cyan Blade Gradient -->
    <linearGradient id="cyanBlade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#amberGold)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Background Stars -->
  <circle cx="110" cy="110" r="4" fill="#fbbf24" opacity="0.9"/>
  <circle cx="400" cy="130" r="5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="100" cy="390" r="4" fill="#a7f3d0" opacity="0.7"/>
  <circle cx="415" cy="380" r="3.5" fill="#fef08a" opacity="0.8"/>

  <!-- Galactic Center Crest Group -->
  <g filter="url(#glow)">
    <!-- Outer Ring with Dashes -->
    <circle cx="256" cy="256" r="170" fill="none" stroke="url(#amberGold)" stroke-width="10" stroke-dasharray="70 25 35 25"/>
    <circle cx="256" cy="256" r="145" fill="none" stroke="#22d3ee" stroke-width="4" stroke-opacity="0.5"/>

    <!-- Star Wings -->
    <path d="M256 86 L274 216 L404 234 L274 252 L256 382 L238 252 L108 234 L238 216 Z" fill="url(#amberGold)"/>
    <path d="M256 130 L266 222 L358 234 L266 246 L256 338 L246 246 L154 234 L246 222 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Lightsaber Beam -->
    <line x1="140" y1="372" x2="372" y2="140" stroke="url(#cyanBlade)" stroke-width="16" stroke-linecap="round"/>
    <line x1="140" y1="372" x2="372" y2="140" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- Lightsaber Hilt -->
    <rect x="126" y="360" width="28" height="14" rx="4" fill="#94a3b8" transform="rotate(-45 140 367)"/>
    <rect x="124" y="362" width="6" height="10" rx="2" fill="#0284c7" transform="rotate(-45 140 367)"/>
  </g>
</svg>